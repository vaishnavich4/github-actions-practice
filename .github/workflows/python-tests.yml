name: Python Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_NAME: ShoppingApp

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run automated tests
        run: pytest

      - name: Display application name
        run: echo "Application name is $APP_NAME"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Build application
        run: echo "Application build completed!"
